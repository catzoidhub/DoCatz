<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    DoCatz app icon (PROVISIONAL colour, DoCatz TODO #3) — the family look, turned to containers.
    · the same rounded tile and MrCatz (eyes are the code brackets "< >") as DevCatz, DBCatz and DialCatz
    · the cat is INSIDE a shipping container seen from the front: both doors swung open, the cat peeking out, the lower
      part of its head behind the container's floor edge — one object, not a cat on a box; never the Docker whale
    · the tile is sky blue: the sea the containers sail on — distinct from DialCatz's teal
    Palette: sky #2479C9 → #6CC4FF tile · indigo #3B33A8 / #6D5DF6 container · white fur · amber #FFC14D bars.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2479C9"/>
      <stop offset="1" stop-color="#6CC4FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.38" r="0.65">
      <stop offset="0" stop-color="#D6F0FF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#D6F0FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F1EEFF"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6D5DF6"/>
      <stop offset="1" stop-color="#3B33A8"/>
    </linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5A4FD8"/>
      <stop offset="1" stop-color="#3B33A8"/>
    </linearGradient>
    <linearGradient id="doorR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#5A4FD8"/>
      <stop offset="1" stop-color="#3B33A8"/>
    </linearGradient>
    <radialGradient id="inside" cx="0.5" cy="0.6" r="0.75">
      <stop offset="0" stop-color="#2A2480"/>
      <stop offset="1" stop-color="#17134A"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0A3A66" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#08304F" flood-opacity="0.35"/>
    </filter>
    <filter id="eyeglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="opening"><rect x="272" y="60" width="480" height="716"/></clipPath>
  </defs>

  <!-- tile -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glow)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sheen)"/>

  <!-- the container, front on: the frame, the dark inside, then the cat, then the open doors and the floor edge -->
  <g filter="url(#soft)">
    <rect x="216" y="430" width="592" height="400" rx="36" fill="url(#box)"/>
    <!-- corner castings -->
    <g fill="#2A2480">
      <rect x="216" y="430" width="46" height="36" rx="10"/><rect x="762" y="430" width="46" height="36" rx="10"/>
      <rect x="216" y="794" width="46" height="36" rx="10"/><rect x="762" y="794" width="46" height="36" rx="10"/>
    </g>
    <!-- the opening -->
    <rect x="272" y="474" width="480" height="312" rx="14" fill="url(#inside)"/>
  </g>

  <g clip-path="url(#opening)">
  <!-- MrCatz inside the container, eyes as < > (the same cat as its siblings) (the same cat as DevCatz's, same seat) -->
  <g transform="translate(512 70) scale(0.78) translate(-512 0)">
    <!-- robot neck ring: a metal joint under the chin (drawn first, the chin covers its back half) -->
    <ellipse cx="512" cy="782" rx="184" ry="40" fill="none" stroke="#2A2480" stroke-width="30"/>
    <ellipse cx="512" cy="782" rx="184" ry="40" fill="none" stroke="#6D5DF6" stroke-width="16"/>
    <!-- robot antenna with a glowing teal tip: the "-oid" -->
    <g filter="url(#soft)">
      <path d="M560 336 L582 196" fill="none" stroke="#3B33A8" stroke-width="22" stroke-linecap="round"/>
      <circle cx="584" cy="176" r="40" fill="#2FD3BC" opacity="0.35" filter="url(#eyeglow)"/>
      <circle cx="584" cy="176" r="28" fill="#2FD3BC" stroke="#FFFFFF" stroke-width="8"/>
    </g>
    <g filter="url(#soft)">
      <path fill="url(#fur)" stroke="url(#fur)" stroke-width="36" stroke-linejoin="round"
        d="M268 418 L246 222 L446 334
           C 487 318, 537 318, 578 334
           L778 222 L756 418
           C 792 470, 808 528, 808 586
           C 808 712, 676 790, 512 790
           C 348 790, 216 712, 216 586
           C 216 528, 232 470, 268 418 Z"/>
      <path fill="#2E8FE0" opacity="0.28" d="M300 404 L286 282 L420 356 Z"/>
      <path fill="#2E8FE0" opacity="0.28" d="M724 404 L738 282 L604 356 Z"/>
    </g>
    <g fill="none" stroke="#3B33A8" stroke-width="48" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="446,548 392,596 446,644"/>
      <polyline points="578,548 632,596 578,644"/>
    </g>
    <path fill="#3B33A8" stroke="#3B33A8" stroke-width="16" stroke-linejoin="round" d="M486 662 L538 662 L512 694 Z"/>
    <path fill="none" stroke="#3B33A8" stroke-width="18" stroke-linecap="round" d="M470 724 C 490 744, 504 744, 512 728 C 520 744, 534 744, 554 724"/>
  </g>

  </g>

  <!-- the floor edge in front of the cat -->
  <rect x="272" y="756" width="480" height="30" fill="#2A2480"/>
  <rect x="272" y="750" width="480" height="10" fill="#6D5DF6" opacity="0.7"/>

  <!-- the doors, swung open to the sides (ribbed, each with an amber locking bar) -->
  <g filter="url(#soft)">
    <path d="M274 474 L 196 440 L 196 820 L 274 786 Z" fill="url(#door)"/>
    <path d="M750 474 L 828 440 L 828 820 L 750 786 Z" fill="url(#doorR)"/>
    <g stroke="#2A2480" stroke-width="10" stroke-linecap="round" opacity="0.5">
      <path d="M240 468 V 796"/>
      <path d="M784 468 V 796"/>
    </g>
    <g stroke="#FFC14D" stroke-width="16" stroke-linecap="round">
      <path d="M214 462 V 800"/><path d="M810 462 V 800"/>
    </g>
  </g>
</svg>
